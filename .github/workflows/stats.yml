name: stats

on:
  schedule:
    - cron: "17 3 * * *"     # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: generate stat svgs
        run: python scripts/generate_stats.py
        env:
          # GITHUB_TOKEN covers public data. To include PRIVATE contributions,
          # create a PAT (read:user) and save it as secret STATS_TOKEN.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh stats"
          file_pattern: assets/stats-*.svg
